# gobi-a2a: copy to a2a.yaml (which git ignores) and edit.
#   cp a2a.example.yaml a2a.yaml
#
# Any string may name environment variables: ${NAME} or ${NAME:-fallback}. An empty value is the same as leaving the
# key out. Relative paths are relative to this file's folder.

gateway:
  host: 127.0.0.1                 # behind a tunnel (Tailscale Funnel, Cloudflare Tunnel), 127.0.0.1 is enough; 0.0.0.0 to listen on every interface
  port: 8000
  public_url: ${A2A_PUBLIC_URL}   # the tunnel's https URL; Agent Cards name it. Unset: http://host:port
  token: ${A2A_TOKEN}             # the bearer token Gobi presents: `gobi-a2a token` makes one
  no_auth: false                  # true runs with no token: local testing only, never behind a tunnel
  workdir: ./work                 # each agent gets <workdir>/<agent>, each A2A conversation a folder under that
  log_level: info

agents:
  # Claude Code through the Claude Agent SDK. Signs in as Claude Code does on this machine (ANTHROPIC_API_KEY or its
  # own login).
  claude:
    enabled: true
    # name: Claude Code
    # description: Claude Code working in its own folder: code, files and web research.
    model: claude-opus-5-5        # a message may pick another: {"model": ...} in its metadata
    effort:                       # low|medium|high|xhigh|max; empty: Claude Code's default. A message may pick another
    thinking:                     # adaptive|disabled|<token budget>; empty: Claude Code's default
    # Nobody is there to approve a tool: only allowed_tools run, any other is refused. No Bash by default.
    allowed_tools: [Read, Glob, Grep, Write, Edit, WebSearch, WebFetch]
    # default|acceptEdits|plan|bypassPermissions|dontAsk|auto. bypassPermissions runs EVERY tool, Bash included,
    # whatever allowed_tools says: only where Claude may do anything the account running the gateway can.
    permission_mode: default
    max_turns:                    # empty: no limit, a run goes until Claude is done
    system_prompt:                # added to Claude Code's own
    # token:                      # this agent's own bearer token instead of the gateway's
    # workdir: ~/a2a-claude-work  # instead of <gateway.workdir>/claude

  # The scaffolds below run a command line agent once per task, in the conversation's folder: each printed line is a
  # progress note, the output is the result. `command` is an argv list (no shell); "{prompt}" is the task's text, or
  # it is appended. model_args / effort_args are added when a model / effort is set here or by the message, and
  # resume_args ("{session}") for a follow-up, all just before a "--" if the command has one.

  cursor:                         # Cursor's agent CLI: https://cursor.com/cli
    enabled: false
    # --trust: each conversation has a new folder, and print mode stops in one it has not been told to trust.
    # Add --force to let it change files and run commands.
    command: [cursor-agent, --print, --output-format, stream-json, --trust, --, "{prompt}"]
    model:
    model_args: [--model, "{model}"]
    resume_args: [--resume, "{session}"]   # a follow-up in the same conversation continues the chat; [] starts afresh
    timeout:                      # seconds; empty: no limit
    env: {}                       # e.g. CURSOR_API_KEY: ${CURSOR_API_KEY}

  codex:                          # OpenAI's Codex CLI: https://github.com/openai/codex
    enabled: false
    # The sandbox lets Codex change files and run commands in the conversation's folder, without network.
    # danger-full-access lifts it: only where Codex may do anything the account running the gateway can.
    command: [codex, exec, --json, --skip-git-repo-check, --sandbox, workspace-write, --color, never, --, "{prompt}"]
    model:                        # empty: Codex's default
    model_args: [--model, "{model}"]
    effort:                       # low|medium|high|xhigh (Codex has no max)
    effort_args: [-c, "model_reasoning_effort={effort}"]
    resume_args: [resume, "{session}"]     # a follow-up in the same conversation continues the session; [] starts afresh
    timeout:
    env: {}                       # e.g. CODEX_API_KEY: ${CODEX_API_KEY}

  omp:                            # oh-my-pi, the pi coding agent: https://github.com/can1357/oh-my-pi (runs on bun)
    enabled: false
    command: [omp, --mode, json, --, "{prompt}"]
    model:                        # empty: omp's default (`omp login` picks the providers)
    model_args: [--model, "{model}"]
    effort:
    effort_args: [--thinking, "{effort}"]
    resume_args: [--resume, "{session}"]   # a follow-up in the same conversation continues the session; [] starts afresh
    timeout:
    env: {}

  copilot:                        # GitHub Copilot CLI: npm install -g @github/copilot, or brew install copilot-cli
    enabled: false
    # Unattended: --allow-all-tools lets Copilot run its tools in the conversation's folder without asking,
    # --allow-all-urls lets it fetch from the web, --no-ask-user keeps it from pausing for a question, --autopilot lets
    # it keep going until the task is done. --allow-all (or --yolo) also lifts its path check: only where Copilot may do
    # anything the account running the gateway can.
    command: [copilot, "--prompt={prompt}", --silent, --no-color, --allow-all-tools, --allow-all-urls, --no-ask-user,
              --autopilot]
    model:                        # empty: Copilot's default; auto lets Copilot pick. A message may pick another
    model_args: ["--model={model}"]
    effort:                       # low|medium|high|xhigh|max; empty: Copilot's default. A message may pick another
    effort_args: ["--reasoning-effort={effort}"]
    # Each conversation is one Copilot session, kept across restarts; a message's {"session": "<id>"|"new"} picks
    # another. [] starts each task afresh.
    resume_args: ["--session-id={session}"]
    timeout:
    env: {}                       # e.g. COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN} (else `copilot login`)
