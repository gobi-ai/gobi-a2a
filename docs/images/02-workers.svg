<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" viewBox="0 0 320 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Wireframe — replace with a screenshot</title><rect x="1" y="1" width="318" height="638" rx="36" fill="#ffffff" stroke="#afb8c1" stroke-width="2"/><rect x="120" y="14" width="80" height="22" rx="11" fill="#1f2328" stroke="none" stroke-width="1"/><line x1="0" y1="96" x2="320" y2="96" stroke="#d0d7de"/><text x="26" y="76" font-size="26" fill="#59636e" font-weight="400" text-anchor="middle">‹</text><text x="160" y="76" font-size="16" fill="#1f2328" font-weight="600" text-anchor="middle">Workers</text><text x="292" y="77" font-size="18" fill="#59636e" font-weight="400" text-anchor="middle">⚙</text><rect x="274" y="58" width="36" height="36" rx="17" fill="none" stroke="#e8590c" stroke-width="2.5"/><circle cx="274" cy="58" r="11" fill="#e8590c"/><text x="274" y="62.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="24" y="126" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">Your agent hands longer tasks to a worker. The ones</text><text x="24" y="143" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">at work now are here; the gear sets up which</text><text x="24" y="160" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">workers it has.</text><text x="24" y="196" font-size="11" fill="#8c959f" font-weight="600" text-anchor="start">RUNNING</text><text x="24" y="222" font-size="13" fill="#8c959f" font-weight="400" text-anchor="start">No workers running right now.</text><text x="160.0" y="666" font-size="12" fill="#8c959f" font-weight="400" text-anchor="middle" font-style="italic">Wireframe — replace with a screenshot</text></svg>
