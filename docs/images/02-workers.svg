<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" viewBox="0 0 320 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Wireframe — replace with a screenshot</title><rect x="1" y="1" width="318" height="638" rx="36" fill="#ffffff" stroke="#afb8c1" stroke-width="2"/><rect x="120" y="14" width="80" height="22" rx="11" fill="#1f2328" stroke="none" stroke-width="1"/><line x1="0" y1="96" x2="320" y2="96" stroke="#d0d7de"/><text x="26" y="76" font-size="26" fill="#59636e" font-weight="400" text-anchor="middle">‹</text><text x="160" y="76" font-size="16" fill="#1f2328" font-weight="600" text-anchor="middle">Workers</text><text x="292" y="77" font-size="18" fill="#59636e" font-weight="400" text-anchor="middle">⚙</text><rect x="274" y="58" width="36" height="36" rx="17" fill="none" stroke="#e8590c" stroke-width="2.5"/><circle cx="310" cy="58" r="11" fill="#e8590c"/><text x="310" y="62.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="20" y="124" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">Your agent hands longer tasks to a worker. The</text><text x="20" y="141" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">ones at work now are here; the gear sets up</text><text x="20" y="158" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">which workers it has.</text><rect x="18.0" y="170" width="89.33333333333333" height="92" rx="16" fill="#f6f8fa" stroke="none" stroke-width="1"/><rect x="30.0" y="182" width="28" height="28" rx="8" fill="#ddf4ff" stroke="none" stroke-width="1"/><text x="44.0" y="201" font-size="13" fill="#0969da" font-weight="700" text-anchor="middle">ϟ</text><text x="30.0" y="234" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">0</text><text x="30.0" y="251" font-size="11" fill="#8c959f" font-weight="400" text-anchor="start">Running</text><rect x="115.33333333333333" y="170" width="89.33333333333333" height="92" rx="16" fill="#f6f8fa" stroke="none" stroke-width="1"/><rect x="127.33333333333333" y="182" width="28" height="28" rx="8" fill="#eff2f5" stroke="none" stroke-width="1"/><text x="141.33333333333331" y="201" font-size="13" fill="#59636e" font-weight="700" text-anchor="middle">⧗</text><text x="127.33333333333333" y="234" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">0</text><text x="127.33333333333333" y="251" font-size="11" fill="#8c959f" font-weight="400" text-anchor="start">Waiting</text><rect x="212.66666666666666" y="170" width="89.33333333333333" height="92" rx="16" fill="#f6f8fa" stroke="none" stroke-width="1"/><rect x="224.66666666666666" y="182" width="28" height="28" rx="8" fill="#dafbe1" stroke="none" stroke-width="1"/><text x="238.66666666666666" y="201" font-size="13" fill="#1a7f37" font-weight="700" text-anchor="middle">✓</text><text x="224.66666666666666" y="234" font-size="20" fill="#1f2328" font-weight="600" text-anchor="start">0</text><text x="224.66666666666666" y="251" font-size="11" fill="#8c959f" font-weight="400" text-anchor="start">Done today</text><text x="20" y="292" font-size="12" fill="#8c959f" font-weight="600" text-anchor="start">Running</text><rect x="18" y="304" width="284" height="122" rx="14" fill="#f6f8fa" stroke="none" stroke-width="1"/><circle cx="160" cy="338" r="18" fill="#eff2f5"/><text x="160" y="344" font-size="16" fill="#59636e" font-weight="400" text-anchor="middle">🤖</text><text x="160" y="376" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">Nothing running</text><text x="160" y="396" font-size="11" fill="#59636e" font-weight="400" text-anchor="middle">When your agent hands a worker a task, you</text><text x="160" y="411" font-size="11" fill="#59636e" font-weight="400" text-anchor="middle">can follow it here.</text><text x="160.0" y="666" font-size="12" fill="#8c959f" font-weight="400" text-anchor="middle" font-style="italic">Wireframe — replace with a screenshot</text></svg>