or="middle">4</text><text x="24" y="318" font-size="11" fill="#8c959f" font-weight="600" text-anchor="start">FROM GOBI</text><rect x="24" y="330" width="272" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="44" y="360" font-size="13" fill="#59636e" font-weight="400" text-anchor="middle">🔒</text><text x="60" y="360" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start">Gobi's own worker</text><text x="60" y="378" font-size="11" fill="#8c959f" font-weight="400" text-anchor="start">No runs this week</text><text x="44" y="416" font-size="13" fill="#59636e" font-weight="400" text-anchor="middle">🔒</text><text x="60" y="416" font-size="14" fill="#1f2328" font-weight="400" text-anchor="start">Gobi's own worker</text><text x="60" y="434" font-size="11" fill="#8c959f" font-weight="400" text-anchor="start">No runs this week</text><line x1="24" y1="386" x2="296" y2="386" stroke="#d0d7de"/><text x="160.0" y="666" font-size="12" fill="#8c959f" font-weight="400" text-anchor="middle" font-style="italic">Wireframe — replace with a screenshot</text></svg>
