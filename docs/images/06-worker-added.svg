ht="400" text-anchor="start">Claude Code working in its own folder:</text><text x="84" y="275" font-size="11" fill="#59636e" font-weight="400" text-anchor="start">code, files and web research.</text><text x="288" y="245" font-size="16" fill="#8c959f" font-weight="400" text-anchor="end">›</text><rect x="32" y="300" width="96.80000000000001" height="22" rx="11" fill="#eff2f5" stroke="none" stroke-width="1"/><text x="42" y="315" font-size="10" fill="#59636e" font-weight="700" text-anchor="start">◍</text><text x="54" y="315" font-size="11" fill="#59636e" font-weight="600" text-anchor="start">Remote agent</text><rect x="134.8" y="300" width="108.60000000000001" height="22" rx="11" fill="#fff1d6" stroke="none" stroke-width="1"/><text x="144.8" y="315" font-size="10" fill="#9a6700" font-weight="700" text-anchor="start">✎</text><text x="156.8" y="315" font-size="11" fill="#9a6700" font-weight="600" text-anchor="start">Changes things</text><rect x="32" y="328" width="126.30000000000001" height="22" rx="11" fill="#eff2f5" stroke="none" stroke-width="1"/><text x="42" y="343" font-size="10" fill="#59636e" font-weight="700" text-anchor="start">○</text><text x="54" y="343" font-size="11" fill="#59636e" font-weight="600" text-anchor="start">No runs this week</text><rect x="18" y="376" width="138.0" height="38" rx="19" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="87.0" y="400" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">+  New worker</text><rect x="164.0" y="376" width="138.0" height="38" rx="19" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="233.0" y="400" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">◍  Remote agent</text><text x="20" y="448" font-size="12" fill="#8c959f" font-weight="600" text-anchor="start">From Gobi</text><rect x="89.19999999999999" y="436" width="20" height="16" rx="8" fill="#eff2f5" stroke="none" stroke-width="1"/><text x="99.19999999999999" y="448" font-size="10" fill="#59636e" font-weight="600" text-anchor="middle">5</text><rect x="18" y="460" width="284" height="122" rx="14" fill="#f6f8fa" stroke="none" stroke-width="1"/><rect x="32" y="474" width="40" height="40" rx="10" fill="#d6f5f0" stroke="none" stroke-width="1"/><text x="52.0" y="500.0" font-size="18" fill="#0f766e" font-weight="600" text-anchor="middle">◍</text><text x="84" y="490" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start">researcher</text><text x="84" y="507" font-size="11" fill="#59636e" font-weight="400" text-anchor="start">Looks things up on the web and reads</text><text x="84" y="521" font-size="11" fill="#59636e" font-weight="400" text-anchor="start">pages.</text><text x="288" y="491" font-size="16" fill="#8c959f" font-weight="400" text-anchor="end">›</text><rect x="32" y="546" width="79.1" height="22" rx="11" fill="#dafbe1" stroke="none" stroke-width="1"/><text x="42" y="561" font-size="10" fill="#1a7f37" font-weight="700" text-anchor="start">◉</text><text x="54" y="561" font-size="11" fill="#1a7f37" font-weight="600" text-anchor="start">Read only</text><rect x="117.1" y="546" width="126.30000000000001" height="22" rx="11" fill="#eff2f5" stroke="none" stroke-width="1"/><text x="127.1" y="561" font-size="10" fill="#59636e" font-weight="700" text-anchor="start">○</text><text x="139.1" y="561" font-size="11" fill="#59636e" font-weight="600" text-anchor="start">No runs this week</text><rect x="83.9" y="592" width="152.2" height="34" rx="17" fill="#1f2328" stroke="none" stroke-width="1"/><text x="160" y="614" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">Added claude-code</text><text x="160.0" y="666" font-size="12" fill="#8c959f" font-weight="400" text-anchor="middle" font-style="italic">Wireframe — replace with a screenshot</text></svg>