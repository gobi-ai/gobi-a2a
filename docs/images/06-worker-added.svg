<svg xmlns="http://www.w3.org/2000/svg" width="320" height="680" viewBox="0 0 320 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Wireframe — replace with a screenshot</title><rect x="1" y="1" width="318" height="638" rx="36" fill="#ffffff" stroke="#afb8c1" stroke-width="2"/><rect x="120" y="14" width="80" height="22" rx="11" fill="#1f2328" stroke="none" stroke-width="1"/><line x1="0" y1="96" x2="320" y2="96" stroke="#d0d7de"/><text x="26" y="76" font-size="26" fill="#59636e" font-weight="400" text-anchor="middle">‹</text><text x="160" y="76" font-size="16" fill="#1f2328" font-weight="600" text-anchor="middle">Worker settings</text><text x="24" y="126" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">The workers your agent can hand a task to. Gobi's</text><text x="24" y="143" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">own are fixed; you can add your own, or a remote</text><text x="24" y="160" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">agent such as Claude Code running on your computer.</text><text x="24" y="196" font-size="11" fill="#8c959f" font-weight="600" text-anchor="start">YOURS</text><rect x="24" y="208" width="272" height="74" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="44" y="236" font-size="14" fill="#59636e" font-weight="400" text-anchor="middle">◍</text><text x="60" y="236" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start">claude-code</text><text x="60" y="254" font-size="11" fill="#8c959f" font-weight="400" text-anchor="start">Claude Code working in its own folder: code, …</text><text x="60" y="269" font-size="11" fill="#8c959f" font-weight="400" text-anchor="start">No runs this week</text><text x="282" y="250" font-size="18" fill="#8c959f" font-weight="400" text-anchor="middle">›</text><rect x="28" y="204" width="264" height="82" rx="14" fill="none" stroke="#1a7f37" stroke-width="2.5"/><rect x="24" y="300" width="130" height="38" rx="19" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="89.0" y="324" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">+  New worker</text><rect x="166" y="300" width="130" height="38" rx="19" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="231.0" y="324" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle">◍  Remote agent</text><text x="24" y="378" font-size="11" fill="#8c959f" font-weight="600" text-anchor="start">FROM GOBI</text><rect x="24" y="390" width="272" height="56" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/><text x="44" y="422" font-size="14" fill="#8c959f" font-weight="400" text-anchor="start">…</text><rect x="70" y="566" width="180" height="36" rx="18" fill="#1f2328" stroke="#1f2328" stroke-width="1"/><text x="160" y="589" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Added claude-code</text><text x="160.0" y="666" font-size="12" fill="#8c959f" font-weight="400" text-anchor="middle" font-style="italic">Wireframe — replace with a screenshot</text></svg>
