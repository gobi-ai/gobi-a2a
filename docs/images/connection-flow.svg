<svg xmlns="http://www.w3.org/2000/svg" width="926" height="230" viewBox="0 0 926 230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How a Gobi task reaches Claude Code on your computer</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs><rect x="1" y="1" width="924" height="228" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="20" y="60" width="150" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="95.0" y="90" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Gobi app</text><text x="95.0" y="110" font-size="11" fill="#59636e" font-weight="400" text-anchor="middle">Workers ▸ Remote agent</text><line x1="172" y1="95" x2="201" y2="95" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="204" y="60" width="150" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="279.0" y="90" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Gobi harness</text><text x="279.0" y="110" font-size="11" fill="#59636e" font-weight="400" text-anchor="middle">in the cloud, polls the task</text><line x1="356" y1="95" x2="385" y2="95" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="388" y="60" width="150" height="70" rx="12" fill="#fff4e5" stroke="#d0d7de" stroke-width="1"/><text x="463.0" y="90" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">https tunnel</text><text x="463.0" y="110" font-size="11" fill="#59636e" font-weight="400" text-anchor="middle">Tailscale Funnel / Cloudflare</text><line x1="540" y1="95" x2="569" y2="95" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="572" y="60" width="150" height="70" rx="12" fill="#ddf4ff" stroke="#d0d7de" stroke-width="1"/><text x="647.0" y="90" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">gobi-a2a</text><text x="647.0" y="110" font-size="11" fill="#59636e" font-weight="400" text-anchor="middle">127.0.0.1:8000  /claude</text><line x1="724" y1="95" x2="753" y2="95" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)"/><rect x="756" y="60" width="150" height="70" rx="12" fill="#ddf4ff" stroke="#d0d7de" stroke-width="1"/><text x="831.0" y="90" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Claude Code</text><text x="831.0" y="110" font-size="11" fill="#59636e" font-weight="400" text-anchor="middle">on your computer</text><text x="20" y="36" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start">What happens after you tap Add</text><rect x="378" y="46" width="538" height="98" rx="16" fill="none" stroke="#8c959f" stroke-width="1" stroke-dasharray="5 5"/><text x="647.0" y="160" font-size="11" fill="#8c959f" font-weight="600" text-anchor="middle">your computer</text><text x="20" y="196" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">1. Gobi reads the Agent Card at &lt;address&gt;/.well-known/agent-card.json (public). It declares Bearer, so the app asks for the token.</text><text x="20" y="214" font-size="12" fill="#59636e" font-weight="400" text-anchor="start">2. Each task: SendMessage with Authorization: Bearer &lt;token&gt;, then GetTask until done; CancelTask when you stop it.</text></svg>
