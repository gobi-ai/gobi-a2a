<svg xmlns="http://www.w3.org/2000/svg" width="858" height="578" viewBox="0 0 858 578" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"><title>Terminal: tailscale funnel --bg 8000, then gobi-a2a printing the agent URLs for the Gobi app</title><rect x="10" y="10" width="837.65" height="558" rx="12" fill="#0d1117" stroke="#30363d"/><path d="M10 22 a12 12 0 0 1 12 -12 h813.65 a12 12 0 0 1 12 12 v18 h-837.65 z" fill="#161b22"/><circle cx="30" cy="25" r="6" fill="#ff5f57"/><circle cx="48" cy="25" r="6" fill="#febc2e"/><circle cx="66" cy="25" r="6" fill="#28c840"/><text x="428.825" y="29" font-size="12" fill="#7d8590" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">gobi-a2a — zsh</text><text x="30.0" y="62" font-size="12.5" fill="#3fb950" font-weight="700" xml:space="preserve">~/gobi-a2a </text><text x="112.8" y="62" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">$ </text><text x="127.8" y="62" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">tailscale funnel --bg 8000</text><text x="30.0" y="81" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve">Available on the internet:</text><text x="30.0" y="100" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve"></text><text x="30.0" y="119" font-size="12.5" fill="#79c0ff" font-weight="400" xml:space="preserve">https://my-mac.tail1234.ts.net</text><text x="30.0" y="138" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">|-- / proxy http://127.0.0.1:8000</text><text x="30.0" y="157" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve"></text><text x="30.0" y="176" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve">Funnel started and running in the background.</text><text x="30.0" y="195" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">To disable the proxy, run: tailscale funnel --https=443 off</text><text x="30.0" y="214" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve"></text><text x="30.0" y="233" font-size="12.5" fill="#3fb950" font-weight="700" xml:space="preserve">~/gobi-a2a </text><text x="112.8" y="233" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">$ </text><text x="127.8" y="233" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">export A2A_PUBLIC_URL=https://my-mac.tail1234.ts.net</text><text x="30.0" y="252" font-size="12.5" fill="#3fb950" font-weight="700" xml:space="preserve">~/gobi-a2a </text><text x="112.8" y="252" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">$ </text><text x="127.8" y="252" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">.venv/bin/gobi-a2a</text><text x="30.0" y="271" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">2026-11-13 17:15:23,709 INFO gobi_a2a: config /Users/you/gobi-a2a/a2a.yaml</text><text x="30.0" y="290" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">gateway  listens on 127.0.0.1:8000, reached at https://my-mac.tail1234.ts.net, bearer token set</text><text x="30.0" y="309" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">claude   https://my-mac.tail1234.ts.net/claude  workdir=/Users/you/gobi-a2a/work/claude  model=claude-o…</text><text x="30.0" y="328" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">cursor   https://my-mac.tail1234.ts.net/cursor  workdir=/Users/you/gobi-a2a/work/cursor  command=cursor…</text><text x="30.0" y="347" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">aider    disabled</text><text x="30.0" y="366" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">omp      disabled</text><text x="30.0" y="385" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve"></text><text x="30.0" y="404" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">Agent URLs ready. </text><text x="165.4" y="404" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve">In the Gobi app: Workers &gt; gear &gt; Remote agent, add each address with the token:</text><text x="30.0" y="423" font-size="12.5" fill="#e8590c" font-weight="400" xml:space="preserve">  • </text><text x="60.1" y="423" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">Claude Code   </text><text x="165.4" y="423" font-size="12.5" fill="#79c0ff" font-weight="700" xml:space="preserve">https://my-mac.tail1234.ts.net/claude</text><text x="30.0" y="442" font-size="12.5" fill="#e8590c" font-weight="400" xml:space="preserve">  • </text><text x="60.1" y="442" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">Cursor Agent  </text><text x="165.4" y="442" font-size="12.5" fill="#79c0ff" font-weight="700" xml:space="preserve">https://my-mac.tail1234.ts.net/cursor</text><text x="30.0" y="461" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve">    </text><text x="60.1" y="461" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">Bearer token  </text><text x="165.4" y="461" font-size="12.5" fill="#ffa657" font-weight="700" xml:space="preserve">3f9c…b7e1</text><text x="233.2" y="461" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">  (the full one is gateway.token: echo $A2A_TOKEN)</text><text x="30.0" y="480" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve"></text><text x="30.0" y="499" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">2026-11-13 17:15:23,709 INFO gobi_a2a: mounted claude at /claude (bearer)</text><text x="30.0" y="518" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">2026-11-13 17:15:23,710 INFO gobi_a2a: mounted cursor at /cursor (bearer)</text><text x="30.0" y="537" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve">INFO:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)</text><rect x="22" y="389" width="814" height="80" rx="8" fill="#e8590c" fill-opacity="0.09" stroke="#e8590c" stroke-width="1.5"/></svg>
