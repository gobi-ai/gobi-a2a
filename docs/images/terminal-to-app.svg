<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Copy the agent's address and the token from the terminal into the Gobi app's Remote agent screen</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect x="1" y="1" width="1058" height="638" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="20" y="52" font-size="16" fill="#1f2328" font-weight="700" text-anchor="start">On your computer</text><text x="20" y="74" font-size="13" fill="#59636e" font-weight="400" text-anchor="start">gobi-a2a prints each agent's address; the token is $A2A_TOKEN.</text><rect x="20" y="120" width="600" height="197" rx="12" fill="#0d1117" stroke="#30363d"/><path d="M20 132 a12 12 0 0 1 12 -12 h576 a12 12 0 0 1 12 12 v18 h-600 z" fill="#161b22"/><circle cx="40" cy="135" r="6" fill="#ff5f57"/><circle cx="58" cy="135" r="6" fill="#febc2e"/><circle cx="76" cy="135" r="6" fill="#28c840"/><text x="320.0" y="139" font-size="12" fill="#7d8590" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">gobi-a2a — zsh</text><g font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"><text x="40.0" y="172" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">Agent URLs ready. </text><text x="175.4" y="172" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">In the Gobi app: Workers &gt; gear &gt; Remote …</text><text x="40.0" y="191" font-size="12.5" fill="#e8590c" font-weight="400" xml:space="preserve">  • </text><text x="70.1" y="191" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">Claude Code   </text><text x="175.4" y="191" font-size="12.5" fill="#79c0ff" font-weight="700" xml:space="preserve">https://my-mac.tail1234.ts.net/claude</text><text x="40.0" y="210" font-size="12.5" fill="#e8590c" font-weight="400" xml:space="preserve">  • </text><text x="70.1" y="210" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">Cursor Agent  </text><text x="175.4" y="210" font-size="12.5" fill="#79c0ff" font-weight="700" xml:space="preserve">https://my-mac.tail1234.ts.net/cursor</text><text x="40.0" y="229" font-size="12.5" fill="#e6edf3" font-weight="400" xml:space="preserve"></text><text x="40.0" y="248" font-size="12.5" fill="#3fb950" font-weight="700" xml:space="preserve">~/gobi-a2a </text><text x="122.8" y="248" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">$ </text><text x="137.8" y="248" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">echo $A2A_TOKEN</text><text x="40.0" y="267" font-size="12.5" fill="#ffa657" font-weight="700" xml:space="preserve">3f9c2a1b7d4e60f58a9c1e2d3b4a5f6e7c8d9a0b5d8eb7e1</text><text x="40.0" y="286" font-size="12.5" fill="#3fb950" font-weight="700" xml:space="preserve">~/gobi-a2a </text><text x="122.8" y="286" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">$ </text><text x="137.8" y="286" font-size="12.5" fill="#e6edf3" font-weight="700" xml:space="preserve">printf %s "$A2A_TOKEN" | pbcopy</text><text x="371.1" y="286" font-size="12.5" fill="#7d8590" font-weight="400" xml:space="preserve">   # macOS: copied</text></g><rect x="171.45" y="176" width="286.42499999999995" height="21" rx="5" fill="none" stroke="#e8590c" stroke-width="2"/><rect x="36" y="252" width="369.2" height="21" rx="5" fill="none" stroke="#e8590c" stroke-width="2"/><circle cx="471.87499999999994" cy="186" r="12" fill="#e8590c"/><text x="471.87499999999994" y="190.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">A</text><circle cx="419.2" cy="262" r="12" fill="#e8590c"/><text x="419.2" y="266.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">B</text><circle cx="32" cy="357" r="12" fill="#e8590c"/><text x="32" y="361.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="54" y="361" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">Copy the agent's address from the Agent URLs block.</text><circle cx="32" cy="387" r="12" fill="#e8590c"/><text x="32" y="391.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">B</text><text x="54" y="391" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">Copy the full token: echo $A2A_TOKEN (the gateway prints it masked).</text><text x="54" y="421" font-size="13" fill="#59636e" font-weight="400" text-anchor="start">On a Mac, pbcopy + Universal Clipboard puts it on your iPhone's clipboard.</text><text x="54" y="451" font-size="13" fill="#59636e" font-weight="400" text-anchor="start">Paste each into the app, then tap Add.</text><text x="904.0" y="30" font-size="1" fill="#1f2328" font-weight="400" text-anchor="start"></text><text x="760" y="36" font-size="1" fill="#1f2328" font-weight="400" text-anchor="start"></text><g transform="translate(760 22) scale(0.9)"><rect x="1" y="1" width="318" height="638" rx="36" fill="#ffffff" stroke="#afb8c1" stroke-width="2"/><rect x="120" y="14" width="80" height="22" rx="11" fill="#1f2328" stroke="none" stroke-width="1"/><line x1="0" y1="96" x2="320" y2="96" stroke="#d0d7de"/><text x="26" y="76" font-size="26" fill="#59636e" font-weight="400" text-anchor="middle">‹</text><text x="160" y="76" font-size="16" fill="#1f2328" font-weight="600" text-anchor="middle">Remote agent</text><text x="24" y="122" font-size="12" fill="#59636e" font-weight="600" text-anchor="start">Address</text><rect x="24" y="130" width="272" height="38" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="36" y="154" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">https://my-mac.tail1234.ts.net/claude</text><text x="24" y="196" font-size="11" fill="#8c959f" font-weight="600" text-anchor="start">WHAT IT SAYS IT IS</text><text x="24" y="218" font-size="14" fill="#1f2328" font-weight="600" text-anchor="start">Claude Code</text><text x="24" y="237" font-size="11" fill="#59636e" font-weight="400" text-anchor="start">Claude Code working in its own folder: code, files</text><text x="24" y="252" font-size="11" fill="#59636e" font-weight="400" text-anchor="start">and web research.</text><text x="24" y="286" font-size="12" fill="#59636e" font-weight="600" text-anchor="start">Name</text><rect x="24" y="294" width="272" height="38" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="36" y="318" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">claude-code</text><text x="24" y="354" font-size="12" fill="#59636e" font-weight="600" text-anchor="start">Token</text><rect x="24" y="362" width="272" height="38" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><text x="36" y="386" font-size="13" fill="#1f2328" font-weight="400" text-anchor="start">••••••••••••••••••••••••</text><text x="24" y="418" font-size="11" fill="#8c959f" font-weight="400" text-anchor="start">Sent only to this agent, and never shown again.</text><rect x="24" y="470" width="272" height="38" rx="19" fill="#1f2328" stroke="#1f2328" stroke-width="1"/><text x="160.0" y="494" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Add</text><rect x="20" y="126" width="280" height="46" rx="10" fill="none" stroke="#e8590c" stroke-width="2.5"/><circle cx="300" cy="126" r="12" fill="#e8590c"/><text x="300" y="130.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">A</text><rect x="20" y="358" width="280" height="46" rx="10" fill="none" stroke="#e8590c" stroke-width="2.5"/><circle cx="300" cy="358" r="12" fill="#e8590c"/><text x="300" y="362.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">B</text></g><text x="904.0" y="602.0" font-size="1" fill="#1f2328" font-weight="400" text-anchor="start"></text><path d="M486 186 C631 186 631 157 772 157" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="762.2" y="145.0" font-size="12" fill="#e8590c" font-weight="600" text-anchor="end">paste in Address</text><path d="M433 262 C605 262 605 366 772 366" fill="none" stroke="#e8590c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="762.2" y="353.8" font-size="12" fill="#e8590c" font-weight="600" text-anchor="end">paste in Token</text></svg>
