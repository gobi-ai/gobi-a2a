[project]
name = "gobi-a2a"
version = "0.1.0"
description = "A config-driven gateway of A2A coding agents (Claude Code, Cursor, Codex, omp) a Gobi harness can hand work to"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk[http-server]>=1.3,<2",
  "claude-agent-sdk>=0.2.180",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pyyaml>=6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
gobi-a2a = "gobi_a2a.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gobi_a2a"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
